<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>git-autosync panel</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --text:#17191c; --muted:#5b6470; --line:#dfe3e8;
  --accent:#2457d6; --accent-bg:#e6edfc; --warn:#a15c00; --warn-bg:#fff1d6; --bad:#b4232a; --bad-bg:#fde4e5;
  --ok:#1b7a3d; --ok-bg:#dff3e5; --code-bg:#eef0f3; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#171a1f; --text:#e8eaed; --muted:#9aa4b2; --line:#2a2f37;
  --accent:#7aa2ff; --accent-bg:#1b2742; --warn:#f0b35a; --warn-bg:#3a2b10; --bad:#ff8087; --bad-bg:#40181b;
  --ok:#6fd392; --ok-bg:#15301f; --code-bg:#20242b;}}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#171a1f; --text:#e8eaed; --muted:#9aa4b2; --line:#2a2f37;
  --accent:#7aa2ff; --accent-bg:#1b2742; --warn:#f0b35a; --warn-bg:#3a2b10; --bad:#ff8087; --bad-bg:#40181b;
  --ok:#6fd392; --ok-bg:#15301f; --code-bg:#20242b;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* cabecera fija: titulo, pestanas y busqueda siempre a la vista */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:12px}
.row1{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.stale{color:var(--bad);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tab{flex:none;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .c{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--code-bg);color:var(--text);font-size:12px;text-align:center}
.tab[aria-selected="true"] .c{background:var(--accent-bg);color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
input[type=search]{flex:1 1 240px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.b{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.view{padding:6px 0 40px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.repo{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.repo>summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;list-style:none}
.repo>summary::-webkit-details-marker{display:none}
.repo>summary::before{content:"▸";color:var(--muted)}
.repo[open]>summary::before{content:"▾"}
.rname{font-weight:600}
.branch{border-top:1px solid var(--line);padding:10px 14px}
.brow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.bname{font-family:var(--mono);font-size:13px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--accent-bg);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.info{background:var(--accent-bg);color:var(--accent)}
.badge.none{background:var(--code-bg);color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
ul.subj{margin:6px 0 6px 18px;padding:0;font-size:13px}
ul.subj li{margin:1px 0}
.cmd{display:flex;gap:8px;align-items:stretch;margin-top:6px}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--code-bg);border-radius:6px;padding:6px 10px;font:12.5px var(--mono)}
.cmd button{flex:none;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--text)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
td.det{color:var(--muted);font-size:13px;max-width:360px}
.empty{color:var(--muted);padding:18px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;text-align:center}
.sec{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
#status{align-self:center;max-width:100%}
footer{margin-top:24px;color:var(--muted);font-size:12px}
@media (max-width:640px){
  .wrap{padding:0 12px}
  td.det{display:none} th.det{display:none}
  .cmd code{font-size:11.5px}
}
</style>
</head>
<body>
<div class="top">
 <div class="wrap">
  <div class="row1">
    <h1>git-autosync <span class="muted" style="font-weight:400">· qué vive solo aquí</span></h1>
    <div class="sub" id="meta"></div>
  </div>
  <div class="tabs" role="tablist" aria-label="Vistas">
    <button class="tab" role="tab" id="t-local" data-v="local" aria-controls="v-local" title="Repos con commits que no están en ningún remoto">Solo local <span class="c" id="c-local"></span></button>
    <button class="tab" role="tab" id="t-only" data-v="only" aria-controls="v-only" title="Repos sin remoto, archivados o con remoto caído">Única copia <span class="c" id="c-only"></span></button>
    <button class="tab" role="tab" id="t-dirty" data-v="dirty" aria-controls="v-dirty" title="Repos con cambios sin commitear">Sin commitear <span class="c" id="c-dirty"></span></button>
    <button class="tab" role="tab" id="t-all" data-v="all" aria-controls="v-all" title="Todos los repos sincronizados">Todos los repos <span class="c" id="c-all"></span></button>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Buscar… (tecla /)" aria-label="Buscar en esta vista">
    <button class="b" id="toggle" type="button">Expandir todo</button>
    <button class="b" id="refresh" type="button" title="Vuelve a leer los datos del sincronizador">Actualizar</button>
    <button class="b" id="copyrep" type="button" title="Copia el reporte completo para pegarlo en el chat">Copiar reporte</button>
    <button class="b" id="theme" type="button" aria-label="Cambiar tema">Tema</button>
    <span class="sub" id="status" aria-live="polite"></span>
  </div>
 </div>
</div>

<div class="wrap">
  <section class="view" id="v-local" role="tabpanel" aria-labelledby="t-local"></section>
  <section class="view" id="v-only" role="tabpanel" aria-labelledby="t-only" hidden></section>
  <section class="view" id="v-dirty" role="tabpanel" aria-labelledby="t-dirty" hidden></section>
  <section class="view" id="v-all" role="tabpanel" aria-labelledby="t-all" hidden>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
    <div class="tw" id="all"></div>
  </section>
  <footer>Panel de solo lectura generado por <code>git-autosync report --html</code>. Los comandos son sugerencias: este panel no ejecuta nada. Datos de la última sincronización, sin consultar la red.</footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var LIVE = location.protocol.indexOf("http") === 0;   /* servido por git-autosync serve: se puede actualizar */
var D = JSON.parse(document.getElementById("data").textContent);
var VIEWS = ["local","only","dirty","all"];
var state = {view:"local", q:"", chip:"problemas", sort:{k:"prio",dir:1}};

/* derivados de D: se recalculan en cada actualizacion */
var live=[], only=[], dirty=[], unpubOf={}, nCommits=0, nLiveRepos=0;

function el(tag, cls, text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function badge(text,cls){return el("span","badge "+(cls||""),text);}
function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function stamp(msg){document.getElementById("status").textContent=msg;}

/* ---------- tema ---------- */
var th=safeGet("gas-theme"); if(th) document.documentElement.setAttribute("data-theme",th);
document.getElementById("theme").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next = dark ? "light":"dark"; document.documentElement.setAttribute("data-theme",next); safeSet("gas-theme",next);
});

/* ---------- derivar vistas desde D ---------- */
var PRIO = {REMOTE_MISSING:0,AUTH_ERROR:0,INTERRUPTED:1,DIVERGED:1,BUSY:2,DIRTY:2,AHEAD:3,NO_LOCAL:4,NO_REMOTE:4,UNKNOWN:4,NETWORK_ERROR:5,PINNED:6,ARCHIVED:7,UP_TO_DATE:8,UPDATED:8};
function prio(s){return PRIO[s]===undefined?9:PRIO[s];}
var STATUS_CLS={UPDATED:"ok",UP_TO_DATE:"ok",AHEAD:"warn",DIVERGED:"info",DIRTY:"warn",BUSY:"warn",NO_REMOTE:"none",REMOTE_MISSING:"bad",ARCHIVED:"",PINNED:"none",NO_LOCAL:"none",INTERRUPTED:"bad",AUTH_ERROR:"bad",NETWORK_ERROR:"warn",UNKNOWN:"warn"};

function derive(){
  live = D.local.filter(function(r){return r.kind==="adelantada"||r.kind==="sin_upstream";});
  unpubOf = {}; D.repos.forEach(function(r){unpubOf[r.name]=r.unpub;});
  var liveRepos = {}; live.forEach(function(r){liveRepos[r.repo]=1;});
  nLiveRepos = Object.keys(liveRepos).length;
  nCommits = Object.keys(liveRepos).reduce(function(a,n){return a+(unpubOf[n]||0);},0);
  var seen = {}; only = D.local.filter(function(r){
    if(["sin_remoto","archivado","remoto_caido"].indexOf(r.kind)<0) return false;
    if(seen[r.repo]) return false; seen[r.repo]=1; return true;});
  dirty = D.repos.filter(function(r){return r.mod>0;});

  document.getElementById("c-local").textContent = nLiveRepos;
  document.getElementById("c-only").textContent = only.length;
  document.getElementById("c-dirty").textContent = dirty.length;
  document.getElementById("c-all").textContent = D.repos.length;

  var meta=document.getElementById("meta"); clear(meta);
  meta.appendChild(document.createTextNode("Generado "+D.generated+" · sincronizado hace "+D.sync_age+" · "+D.repos.length+" repos "));
  if(D.stale) meta.appendChild(el("span","stale","⚠ atrasado"));
}

/* ---------- pestanas ---------- */
function setView(v, push){
  if(VIEWS.indexOf(v)<0) v="local";
  state.view=v;
  VIEWS.forEach(function(x){
    var on = x===v;
    var t=document.getElementById("t-"+x);
    t.setAttribute("aria-selected", on?"true":"false");
    t.tabIndex = on?0:-1;
    document.getElementById("v-"+x).hidden = !on;
  });
  document.getElementById("q").placeholder = "Buscar en "+document.getElementById("t-"+v).firstChild.textContent.trim().toLowerCase()+"… (tecla /)";
  if(push && location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  render();
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click",function(){setView(t.dataset.v,true);});
  t.addEventListener("keydown",function(e){
    var i=VIEWS.indexOf(state.view);
    if(e.key==="ArrowRight"){e.preventDefault(); setView(VIEWS[(i+1)%VIEWS.length],true); document.getElementById("t-"+state.view).focus();}
    if(e.key==="ArrowLeft"){e.preventDefault(); setView(VIEWS[(i+VIEWS.length-1)%VIEWS.length],true); document.getElementById("t-"+state.view).focus();}
  });
});
window.addEventListener("hashchange",function(){setView(location.hash.slice(1),false);});

/* ---------- busqueda y atajos ---------- */
var q=document.getElementById("q");
q.addEventListener("input",function(){state.q=q.value.toLowerCase(); render();});
document.addEventListener("keydown",function(e){
  if(e.key==="/" && document.activeElement!==q && !/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault(); q.focus();}
  if(e.key==="Escape" && document.activeElement===q){q.value=""; state.q=""; render(); q.blur();}
});
function matches(parts){
  if(!state.q) return true;
  return parts.join(" ").toLowerCase().indexOf(state.q)>=0;
}

/* ---------- expandir/contraer ---------- */
document.getElementById("toggle").addEventListener("click",function(){
  var ds=document.querySelectorAll("#v-local details"); if(!ds.length) return;
  var open=!ds[0].open; ds.forEach(function(d){d.open=open;});
  this.textContent=open?"Contraer todo":"Expandir todo";
});

/* ---------- actualizar y copiar reporte (solo con git-autosync serve) ---------- */
function fetchText(url){
  return fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t.slice(0,120));});
    return r;
  });
}
function refresh(){
  if(!LIVE){ stamp("Abre el panel con git-autosync serve para actualizar."); return; }
  var b=document.getElementById("refresh"); b.disabled=true; stamp("Actualizando…");
  fetchText("/api/data").then(function(r){return r.json();}).then(function(nd){
    D=nd; derive(); render();
    stamp("Actualizado "+new Date().toLocaleTimeString());
  }).catch(function(e){ stamp("No se pudo actualizar: "+e.message); })
    .then(function(){ b.disabled=false; });
}
function fallbackCopy(t){
  var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
  var ok=false; try{ok=document.execCommand("copy");}catch(e){} document.body.removeChild(ta); return ok;
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){return true;}, function(){return fallbackCopy(t);});
  }
  return Promise.resolve(fallbackCopy(t));
}
function copyReport(){
  if(!LIVE){ stamp("Abre el panel con git-autosync serve para copiar el reporte."); return; }
  var b=document.getElementById("copyrep"); b.disabled=true; b.textContent="Generando…"; stamp("Generando reporte…");
  fetchText("/api/report").then(function(r){return r.text();}).then(copyText).then(function(ok){
    stamp(ok ? "Reporte copiado: pégalo en el chat." : "No pude copiar: selecciona el texto manualmente.");
  }).catch(function(e){ stamp("No se pudo generar el reporte: "+e.message); })
    .then(function(){ b.disabled=false; b.textContent="Copiar reporte"; });
}
var rb=document.getElementById("refresh"), cb=document.getElementById("copyrep");
rb.addEventListener("click",refresh);
cb.addEventListener("click",copyReport);
if(!LIVE){
  rb.disabled=true; rb.title="Disponible con git-autosync serve";
  stamp("Vista estática. Con git-autosync serve puedes actualizar y copiar el reporte.");
}

/* ---------- utilidades de tabla ---------- */
function copyBtn(text){
  var b=el("button",null,"Copiar"); b.type="button";
  b.addEventListener("click",function(){
    copyText(text).then(function(ok){ b.textContent=ok?"Copiado ✓":"Selecciona y copia"; setTimeout(function(){b.textContent="Copiar";},1500); });
  });
  return b;
}
function table(cols, rows, sortState, onSort){
  var wrap=el("table"); var hr=el("tr");
  cols.forEach(function(c){
    var th=el("th", c.det?"det":null);
    if(c.sort && onSort){
      var btn=el("button",null, c.h + (sortState && sortState.k===c.sort ? (sortState.dir>0?" ↑":" ↓") : ""));
      btn.type="button"; btn.addEventListener("click",function(){onSort(c.sort);}); th.appendChild(btn);
    } else th.textContent=c.h;
    hr.appendChild(th);
  });
  var thead=el("thead"); thead.appendChild(hr); wrap.appendChild(thead);
  var tb=el("tbody"); rows.forEach(function(r){var tr=el("tr");
    cols.forEach(function(c){
      var td=el("td", (c.num?"num ":"")+(c.nw?"nw ":"")+(c.det?"det":"")); var v=c.f(r);
      if(v instanceof Node) td.appendChild(v); else td.textContent=v; tr.appendChild(td);});
    tb.appendChild(tr);});
  wrap.appendChild(tb); return wrap;
}
function empty(box, text){ box.appendChild(el("div","empty",text)); }

/* ---------- vista 1: commits sin subir ---------- */
function renderLocal(){
  var box=document.getElementById("v-local"); clear(box);
  var byRepo={}; live.forEach(function(r){
    if(!matches([r.repo,r.branch].concat(r.subjects))) return; (byRepo[r.repo]=byRepo[r.repo]||[]).push(r);});
  var names=Object.keys(byRepo).sort(function(a,b){return (unpubOf[b]||0)-(unpubOf[a]||0);});
  if(!names.length){ empty(box, live.length?"Nada con este filtro.":"No hay commits solo locales. Todo está subido. ✓"); return; }
  box.appendChild(el("p","hint", names.length+" repo(s), "+names.reduce(function(a,n){return a+byRepo[n].length;},0)+" rama(s). Abre un repo para ver sus ramas y el comando de subida."));
  names.forEach(function(n){
    var rs=byRepo[n]; var tot=unpubOf[n]||0;
    var d=el("details","repo"); if(state.q || names.length===1) d.open=true;
    var sm=el("summary");
    sm.appendChild(el("span","rname",n)); sm.appendChild(badge("+"+tot+" únicos","warn"));
    sm.appendChild(el("span","muted",rs.length+" rama"+(rs.length>1?"s":"")));
    d.appendChild(sm);
    rs.forEach(function(r){
      var b=el("div","branch"); var row=el("div","brow");
      row.appendChild(el("span","bname",r.branch)); row.appendChild(badge("+"+r.n,"warn"));
      row.appendChild(r.kind==="sin_upstream"?badge("nunca subida","bad"):badge("adelantada de "+r.upstream,"warn"));
      row.appendChild(el("span","muted",r.date+(r.open?" · abierta en un checkout":"")));
      b.appendChild(row);
      var ul=el("ul","subj"); r.subjects.forEach(function(sj){ul.appendChild(el("li",null,sj));});
      if(r.n>r.subjects.length) ul.appendChild(el("li","muted","… y "+(r.n-r.subjects.length)+" más"));
      b.appendChild(ul);
      if(r.command){
        var c=el("div","cmd"); c.appendChild(el("code",null,r.command));
        if(r.command.charAt(0)!=="#") c.appendChild(copyBtn(r.command));
        b.appendChild(c);
      }
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}

/* ---------- vista 2: unica copia ---------- */
function renderOnly(){
  var box=document.getElementById("v-only"); clear(box);
  var rows=only.filter(function(r){return matches([r.repo,r.kind]);});
  box.appendChild(el("p","hint","Repos sin un lugar donde subirlos. Si el remoto se borró a propósito, márcalo con git-autosync archive."));
  if(!rows.length){ empty(box, only.length?"Nada con este filtro.":"Ningún repo es única copia."); return; }
  var tw=el("div","tw");
  tw.appendChild(table([
    {h:"Repo",f:function(r){return r.repo;}},
    {h:"Tipo",f:function(r){return badge({sin_remoto:"sin remoto",archivado:"archivado",remoto_caido:"remoto caído"}[r.kind],r.kind==="archivado"?"none":"bad");}},
    {h:"Commits",num:1,f:function(r){return String(r.commits);}},
    {h:"Último",nw:1,f:function(r){return r.date||"-";}}], rows));
  box.appendChild(tw);
}

/* ---------- vista 3: sin commitear ---------- */
function renderDirty(){
  var box=document.getElementById("v-dirty"); clear(box);
  var rows=dirty.filter(function(r){return matches([r.name,r.status]);}).sort(function(a,b){return b.mod-a.mod;});
  if(!rows.length){ empty(box, dirty.length?"Nada con este filtro.":"Ningún checkout tiene cambios sin commitear. ✓"); return; }
  var tw=el("div","tw");
  tw.appendChild(table([
    {h:"Repo",f:function(r){return r.name;}},
    {h:"Modificados",num:1,f:function(r){return String(r.mod);}},
    {h:"Sin rastrear",num:1,f:function(r){return String(r.untracked);}},
    {h:"Stash",num:1,f:function(r){return String(r.stash);}},
    {h:"Estado",nw:1,f:function(r){return badge(r.status,STATUS_CLS[r.status]);}}], rows));
  box.appendChild(tw);
}

/* ---------- vista 4: todos los repos ---------- */
var CHIPS=[
  {k:"problemas",l:"Divergentes o adelantadas",f:function(r){return r.status==="DIVERGED"||r.status==="AHEAD";}},
  {k:"todos",l:"Todos",f:function(){return true;}},
  {k:"ok",l:"Al día",f:function(r){return r.status==="UP_TO_DATE"||r.status==="UPDATED";}},
  {k:"sinremoto",l:"Sin remoto",f:function(r){return r.status==="NO_REMOTE";}},
  {k:"archivado",l:"Archivados",f:function(r){return r.status==="ARCHIVED";}},
  {k:"otros",l:"Otros estados",f:function(r){return ["UP_TO_DATE","UPDATED","NO_REMOTE","ARCHIVED","DIVERGED","AHEAD"].indexOf(r.status)<0;}}
];
function renderChips(){
  var box=document.getElementById("chips"); clear(box);
  CHIPS.forEach(function(c){
    var n=D.repos.filter(c.f).length;
    var b=el("button","chip",c.l+" ("+n+")"); b.type="button";
    b.setAttribute("aria-pressed", state.chip===c.k?"true":"false");
    b.addEventListener("click",function(){state.chip=c.k; renderAll();});
    box.appendChild(b);
  });
}
function renderAll(){
  renderChips();
  var box=document.getElementById("all"); clear(box);
  var fdef=CHIPS.filter(function(c){return c.k===state.chip;})[0]||CHIPS[0];
  var rows=D.repos.filter(function(r){return fdef.f(r) && matches([r.name,r.status,r.reason,r.default]);});
  rows.sort(function(a,b){
    var s=state.sort;
    if(s.k==="prio"){var d=prio(a.status)-prio(b.status); return d || a.name.localeCompare(b.name);}
    if(s.k==="name"){return s.dir*a.name.localeCompare(b.name);}
    if(s.k==="unpub"){return s.dir*((a.unpub||0)-(b.unpub||0));}
    if(s.k==="last"){return s.dir*String(a.last||"").localeCompare(String(b.last||""));}
    return 0;
  });
  if(!rows.length){ empty(box,"Nada con este filtro."); return; }
  box.appendChild(table([
    {h:"Repo",sort:"name",f:function(r){return r.name;}},
    {h:"Estado",sort:"prio",nw:1,f:function(r){return badge(r.status,STATUS_CLS[r.status]);}},
    {h:"Rama",nw:1,f:function(r){return r.default||"-";}},
    {h:"Commits sin subir",sort:"unpub",num:1,nw:1,f:function(r){return String(r.unpub||0);}},
    {h:"Último",sort:"last",nw:1,f:function(r){return r.last||"-";}},
    {h:"Detalle",det:1,f:function(r){return r.reason||"";}}
  ], rows, state.sort, function(k){
    state.sort = (state.sort.k===k) ? {k:k, dir:-state.sort.dir} : {k:k, dir:(k==="last"||k==="unpub")?-1:1};
    renderAll();
  }));
}

function render(){
  if(state.view==="local") renderLocal();
  else if(state.view==="only") renderOnly();
  else if(state.view==="dirty") renderDirty();
  else renderAll();
}

/* arranque */
derive();
setView(location.hash.slice(1), false);
})();
</script>
</body>
